# ============================================
# AceEconomy 設定檔
# ============================================

# v2 config schema contract (clean-slate, AceLib ConfigManager)
# 版本欄位為 AceLib 約定的 `version: "major.minor"`；v2 固定為 2.0。
# 本檔不讀取、不遷移 v1 的 config-version 表面。
version: "2.0"

# 資料儲存設定
# 儲存類型決定 CompositionRoot 在 startPersistence() 中接線哪個 backend：
#   json   → JsonPersistenceBackend（預設，fresh install 自動建立 data-v2.json）
#   sqlite → SqlBackend + SqliteDialect，檔案位於 plugin data folder 下
#   mysql  → SqlBackend + MySqlDialect，連線與 pool 由 storage.mysql.* 提供
storage:
  type: json

  # 僅當 type 為 sqlite 時使用；檔案必須位於 plugin data folder 內，路徑越界會被拒絕
  sqlite:
    path: data-v2.sqlite

  # 僅當 type 為 mysql 時使用；host / port / database / username / password 全部
  # 來自 config，不在原始碼或預設值中硬編任何 secret
  mysql:
    host: localhost
    port: 3306
    database: aceeconomy
    username: root
    password: ""

    # HikariCP 連線池設定（僅 mysql 模式生效）
    pool-size: 10
    max-lifetime: 1800000

# 一般設定
settings:
  # 語言設定 (en_US, zh_TW, zh_CN)
  locale: zh_TW

  # 主指令別名 (預設: aceeco)
  # 若設定為 "bank"，則可以使用 /bank 來執行 /aceeco 指令
  main-command-alias: "aceeco"

# 經濟系統設定
economy:
  # 是否允許負資產 (債務系統)
  allow-negative-balance: true
  # 預設債務上限 (當玩家沒有權限設定時使用)
  default-debt-limit: 0.0

# 貨幣設定 (Multi-Currency System)
currencies:
  dollar: # 內部 ID
    name: "金幣"
    symbol: "$"
    scale: 2
    default: true # 這是 Vault 使用的主要貨幣
  token:
    name: "活動代幣"
    symbol: "ⓒ"
    scale: 0
    default: false

# 玩家新建帳戶時的預設餘額
start-balance: 1000.0

# Discord Webhook 設定
discord:
  # 是否啟用 Discord 通知
  enabled: false
  # Webhook URL
  webhook-url: "https://discord.com/api/webhooks/..."

# 排行榜設定
leaderboard:
  # 是否啟用排行榜
  enabled: true
  # 快取更新時間 (秒)，預設 5 分鐘
  cache-time-seconds: 300
  # 每頁顯示數量
  page-size: 10