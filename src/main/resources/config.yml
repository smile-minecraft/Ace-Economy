# ============================================
# AceEconomy 設定檔
# ============================================

# v2 config schema contract (clean-slate, AceLib ConfigManager)
# 版本欄位為 AceLib 約定的 `version: "major.minor"`；v2 固定為 2.0。
# 本檔不讀取、不遷移 v1 的 config-version 表面。
version: "2.0"

# 資料儲存設定
# 儲存類型決定 CompositionRoot 在 startPersistence() 中接線哪個 backend：
#   json   → JsonPersistenceBackend（預設，fresh install 自動建立 data-v2.json）
#   sqlite → SqlBackend + SqliteDialect，檔案位於 plugin data folder 下
#   mysql  → SqlBackend + MySqlDialect，連線與 pool 由 storage.mysql.* 提供
storage:
  type: json

  # 僅當 type 為 sqlite 時使用；檔案必須位於 plugin data folder 內，路徑越界會被拒絕
  sqlite:
    path: data-v2.sqlite

  # 僅當 type 為 mysql 時使用；host / port / database / username / password 全部
  # 來自 config，不在原始碼或預設值中硬編任何 secret
  mysql:
    host: localhost
    port: 3306
    database: aceeconomy
    username: root
    password: ""

    # HikariCP 連線池設定（僅 mysql 模式生效）
    pool-size: 10
    max-lifetime: 1800000

# 一般設定
settings:
  # 語言設定 (en_US, zh_TW, zh_CN)
  locale: zh_TW

  # 主指令別名 (預設: aceeco)
  # 啟動時掛為 /aceeco 管理指令的額外別名；空白則維持預設入口。
  # 不得與 plugin.yml 已宣告的 root/alias 或其他 AceEconomy 指令衝突，
  # 衝突會讓插件啟動失敗而不是覆蓋既有入口。
  # 只在啟動時生效：Bukkit 只轉送 plugin.yml 宣告的標籤，修改後需重啟。
  main-command-alias: "aceeco"

# 經濟系統設定
economy:
  # 是否允許負資產 (債務系統)
  allow-negative-balance: true
  # 預設債務上限 (當玩家沒有權限設定時使用)
  default-debt-limit: 0.0

# 貨幣設定 (Multi-Currency System)
# 此區塊由管理者自行定義，可新增任意數量的貨幣（如下方註解的 gem 範例）。
# 每筆貨幣必須齊備四個欄位：
#   name   文字；顯示名稱
#   symbol 文字；顯示符號
#   scale  非負整數；小數位數
#   default 布林；整個區塊必須恰好一筆 true
# ID 是本層的 key，去除前後空白並轉小寫後只能使用 a-z、0-9 與 _；
# 僅大小寫或空白差異的 ID 視為重複。任何缺欄位、型別錯誤、重複、
# 空區塊或預設貨幣數量不為一，都會讓插件啟動失敗且不半套用。
# 貨幣組合只在啟動時讀取一次；reload 不會重建 registry，修改後請重啟。
currencies:
  dollar: # 內部 ID
    name: "金幣"
    symbol: "$"
    scale: 2
    default: true # 這是 Vault 使用的主要貨幣
  token:
    name: "活動代幣"
    symbol: "ⓒ"
    scale: 0
    default: false
  # gem:
  #   name: "寶石"
  #   symbol: "*"
  #   scale: 1
  #   default: false

# 銀行 GUI 版面設定
# 標題、大小、按鈕槽位與動作全部由此區塊控制；出貨預設重現舊版行為
# （存款 slot 4、提領 100 slot 11、提領 500 slot 13、關閉 slot 15、大小 27）。
#   enabled   布林；false 時 /bank 不再開啟介面
#   title-key 語言鍵（非 raw 文字）；顯示經安全 Component 管線解析
#   size      9/18/27/36/45/54 其中之一
#   actions   每個按鈕一個條目：
#     slot      整數，需在 [0, size) 內且不可重複
#     type      deposit / withdraw / close / none 其中之一
#     amount    僅 withdraw 需要，且必須為正整數
#     currency  僅 withdraw 需要，已知幣別 ID；缺省為預設幣別
#     material  顯示物品材質（type 為 none 時免填；air 會被拒絕）
#     name-key / lore-keys 按鈕顯示文字的語言鍵
# 任何格式錯誤都會讓插件啟動失敗且不半套用；修改後請重啟，已開啟的介面維持舊版面。
bank-gui:
  enabled: true
  title-key: "gui.bank-title"
  size: 27
  actions:
    deposit:
      slot: 4
      type: deposit
      material: "CHEST"
      name-key: "gui.bank-deposit-name"
      lore-keys: ["gui.bank-deposit-lore"]
    withdraw100:
      slot: 11
      type: withdraw
      amount: 100
      currency: dollar
      material: "PAPER"
      name-key: "gui.bank-withdraw-name"
      lore-keys: ["gui.bank-withdraw-lore"]
    withdraw500:
      slot: 13
      type: withdraw
      amount: 500
      currency: dollar
      material: "PAPER"
      name-key: "gui.bank-withdraw-name"
      lore-keys: ["gui.bank-withdraw-lore"]
    close:
      slot: 15
      type: close
      material: "BARRIER"
      name-key: "gui.bank-close-name"
      lore-keys: []

# 玩家新建帳戶時的預設餘額
start-balance: 1000.0

# Discord Webhook 設定
discord:
  # 是否啟用 Discord 通知
  enabled: false
  # Webhook URL
  webhook-url: "https://discord.com/api/webhooks/..."

# 排行榜設定
leaderboard:
  # 是否啟用排行榜
  # false 時插件不會建立/掛上可執行的 /baltop 指令處理器（啟動時生效）。
  # plugin.yml 仍宣告靜態的 baltop 標籤，伺服器只會回應 usage 說明；修改後請重啟。
  enabled: true
  # 快取更新時間 (秒)，預設 5 分鐘
  cache-time-seconds: 300
  # 每頁顯示數量
  page-size: 10