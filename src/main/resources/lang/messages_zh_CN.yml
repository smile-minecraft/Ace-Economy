  damaged: "<red>这张支票已损坏！</red>"
  voided: "<red>此支票已被银行注销 (Voided Check)！</red>"
  redeem-success: "<green>已兑换支票：<yellow><amount></yellow> <gray>(签發人：<issuer>)</gray></green>"
  redeem-failed: "<red>兑换失败，交易被取消！</red>"

