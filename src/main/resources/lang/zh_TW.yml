# ============================================
# AceEconomy v2 Language File (zh_TW)
# Format: MiniMessage (tags) + {placeholder} (typed variable substitution)
# ============================================

message:
  prefix: "<gold>[AceEconomy]</gold> <gray>"

general:
  no-permission: "<red>您沒有使用此指令的權限！</red>"
  invalid-amount: "<red>無效金額：<white>{amount}</white></red>"
  player-not-found: "<red>找不到玩家：<white>{player}</white></red>"
  status: "<green>狀態：<white>{status}</white></green>"

economy:
  balance-check: "您的餘額：<yellow>{balance}</yellow>"
  balance-check-other: "<aqua>{player}</aqua> 的餘額：<yellow>{balance}</yellow>"
  payment-sent: "<green>已發送 <yellow>{amount}</yellow> 給 <aqua>{player}</aqua>！</green>"
  payment-received: "<green>已收到來自 <aqua>{player}</aqua> 的 <yellow>{amount}</yellow>！</green>"
  insufficient-funds: "<red>餘額不足！</red>"

admin:
  give: "<green>已給予 <aqua>{player}</aqua> <yellow>{amount}</yellow></green>"
