  help-header: "<yellow>--- AceEconomy 命令帮助 ---</yellow>"
  help-money: "<white>/money [玩家]</white> <gray>- 查看账户余额</gray>"
  help-withdraw: '<white>/withdraw \<金额></white> <gray>- 将余额提取为支票</gray>'
