  invalid-amount: "<red>无效金额：<white>{amount}</white></red>"
  player-not-found: "<red>找不到玩家：<white>{player}</white></red>"
  status: "<green>状态：<white>{status}</white></green>"
  amount-must-be-positive: "<red>金额必须大于 0！</red>"
  amount-overflow: "<red>金额超过允许的最大值</red>"
  default-currency-missing: "<red>尚未配置默认货币</red>"
  player-offline: "<red>玩家 <white>{player}</white> 不在线！</red>"
  player-no-account: "<red>该玩家没有账户数据！</red>"
  account-not-loaded: "<red>账户尚未加载，请稍后再试！</red>"
  invalid-time-format: "<red>无效的时间格式！请使用如 1h, 30m, 1d 的格式。</red>"
  inventory-full: "<red>背包已满，无法提取支票！</red>"
  transaction-failed: "<red>交易失败！</red>"
  transaction-cancelled: "<red>交易被取消！</red>"
  reload-success: "<green>配置文件已重新加载！</green>"
  unknown-currency: "<red>错误: 找不到货币 <white>{currency}</white>。</red>"
